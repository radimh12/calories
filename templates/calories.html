{% extends "base.html" %}
{% block title %}Calories{% endblock %}
{% block content %}
	<div>Total: {{ total }}</div>
	<table>
		<tr>
			<th>Food</th>
			<th>Calories</th>
			<th>Amount</th>
		</tr>
			{% for item in data %}
			<tr>
				<td>{{ item.name }}</td>
				<td>{{ item.kcal }}</td>
				<td>{{ item.amount }} g</td>
			</tr>
			{% endfor %}
	</table>
{% endblock %}
